<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3e70">
<title>Arrendamentos | Professor Moreira</title>
<style>
:root{--navy:#0b3e70;--blue:#175fa5;--sky:#eaf5ff;--ink:#153653;--green:#087c55;--red:#b52b35;--gold:#ffcb56}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink)}body{background:linear-gradient(155deg,#d5efff,#f3f9ff 48%,#dceeff)}.app{min-height:100svh;max-width:820px;margin:auto;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}header{padding:13px 6px 9px;text-align:center;color:var(--navy);font-size:clamp(15px,4.3vw,20px);font-weight:900;letter-spacing:.015em}.rule{height:4px;border-radius:8px;background:#c9dfef;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#1595da,#0b6dbe);transition:width .2s}.slide{flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(13px,2.3vh,22px);padding:18px 3px 24px;animation:rise .2s ease}@keyframes rise{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}.eyebrow{font-size:clamp(15px,4vw,19px);color:#22699f;font-weight:850;text-transform:uppercase;letter-spacing:.06em}.card{background:white;border:2px solid #c5e4f8;border-radius:24px;padding:clamp(19px,5vw,34px);box-shadow:0 12px 30px #194a7130}.card h1{font-size:clamp(29px,8vw,48px);line-height:1.12;color:var(--navy);margin:0 0 17px}.card h2{font-size:clamp(26px,6.8vw,39px);line-height:1.15;color:var(--navy);margin:0 0 14px}.card p,.card li{font-size:clamp(20px,5.3vw,28px);line-height:1.36;margin:0 0 13px}.card p:last-child,.card li:last-child{margin-bottom:0}ul{margin:0;padding-left:1.2em}li{padding-left:.1em}.tag{display:inline-block;background:#e5f4ff;color:var(--navy);font-size:clamp(15px,4vw,19px);font-weight:850;padding:7px 12px;border-radius:10px;margin-bottom:15px}.lead{font-size:clamp(23px,6.2vw,34px)!important;font-weight:780;color:var(--navy)}.note{background:#e7f7ef;border-left:7px solid #159369;padding:15px 17px;border-radius:12px;font-size:clamp(19px,5vw,25px);line-height:1.33;font-weight:720}.note.warn{background:#fff3dc;border-color:#e5a524}.note.red{background:#ffecef;border-color:var(--red)}.formula{font-size:clamp(21px,5.6vw,32px);font-weight:900;text-align:center;background:#e5f4ff;color:var(--navy);border-radius:16px;padding:18px 12px;line-height:1.3}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{padding:15px;border-radius:16px;background:#eaf5ff;font-size:clamp(18px,4.7vw,24px);line-height:1.32}.tile:nth-child(2){background:#e9f8ee}.tile strong{display:block;color:var(--navy);font-size:1.1em;margin-bottom:5px}.large{font-size:clamp(23px,6vw,32px)!important}.accent{color:var(--blue);font-weight:850}.green{color:var(--green);font-weight:850}.redtext{color:var(--red);font-weight:850}footer{position:sticky;bottom:0;background:#e9f5ffed;border-top:1px solid #c0def0;padding:10px 0 max(10px,env(safe-area-inset-bottom));backdrop-filter:blur(8px)}.nav{display:flex;align-items:center;gap:9px}.nav button{border:0;background:var(--navy);color:white;border-radius:14px;min-width:58px;height:53px;font-size:25px;font-weight:800;cursor:pointer}.nav button:disabled{opacity:.35;cursor:default}.nav .restart{background:#e0eff9;color:var(--navy);font-size:16px;padding:0 12px}.count{flex:1;text-align:center;font-size:17px;font-weight:850;color:var(--navy)}.brand{font-size:13px;text-align:center;color:#345b7a;font-weight:700;padding:8px 0 0}@media(max-width:370px){.grid{grid-template-columns:1fr}.tile{padding:10px}.card{padding:18px}.slide{justify-content:flex-start;padding-top:18px}}@media(max-height:680px){.slide{justify-content:flex-start}.card p,.card li{font-size:clamp(19px,4.8vw,24px)}.card h2{font-size:clamp(25px,6.3vw,33px)}}
</style>
</head>
<body><div class="app"><header>CURSO DE CONTABILIDADE<br>PROFESSOR MOREIRA</header><div class="rule"><div class="fill" id="fill"></div></div><main class="slide" id="slide" aria-live="polite"></main><footer><div class="nav"><button id="prev" type="button" aria-label="Tela anterior">←</button><span class="count" id="count"></span><button id="next" type="button" aria-label="Próxima tela">→</button><button id="restart" class="restart" type="button">Reiniciar</button></div><div class="brand">Quem quer ser aprovado <strong>estuda</strong>.</div></footer></div>
<script>
const slides=[
{label:'NBC TG 06 (R3) · CPC 06 (R2)',body:`<h1>ARRENDAMENTOS</h1><p class="lead">Entenda quem controla o uso do bem, o que a arrendatária registra e como a arrendadora classifica o contrato.</p><div class="note">Um conceito por tela. Use as setas para avançar.</div>`},
{label:'Conceito',body:`<h2>O que é arrendamento?</h2><p>É o contrato que transfere ao cliente o <span class="accent">direito de controlar o uso de um ativo identificado</span>, por um período, em troca de contraprestação.</p><div class="note warn">O nome “aluguel” não impede que o contrato contenha arrendamento.</div>`},
{label:'Identificação · 1 de 4',body:`<h2>Existe ativo identificado?</h2><p>É possível determinar <span class="accent">qual bem</span> será utilizado?</p><p>Uma máquina específica pode ser um ativo identificado.</p><div class="note red">Se o fornecedor tem direito <strong>substantivo</strong> de substituí-la durante o uso, examine esse direito antes de concluir.</div>`},
{label:'Identificação · 2 de 4',body:`<h2>Quem recebe os benefícios?</h2><p>O cliente deve obter <span class="accent">substancialmente todos os benefícios econômicos</span> do uso do ativo durante o período.</p><div class="note">Pense na produção, na utilização e nas receitas geradas pelo uso.</div>`},
{label:'Identificação · 3 de 4',body:`<h2>Quem dirige o uso?</h2><p>O cliente deve poder decidir <span class="accent">como e para qual finalidade</span> o ativo será usado.</p><div class="note warn">A pergunta central é: <strong>quem toma as decisões relevantes sobre o uso?</strong></div>`},
{label:'Identificação · 4 de 4',body:`<h2>E se o uso já estiver predeterminado?</h2><p>Verifique se o cliente pode <strong>operar</strong> o ativo por todo o período sem alteração de suas instruções pelo fornecedor <strong>ou</strong> se <strong>projetou</strong> o ativo para predeterminar o uso.</p><div class="note red">Projetar o ativo <strong>não é requisito geral</strong> de todo arrendamento.</div>`},
{label:'Síntese da identificação',body:`<h2>Junte as condições</h2><div class="formula">Ativo identificado<br>+ controle do uso<br>+ período<br>+ contraprestação</div><p>O período pode ser expresso em <strong>tempo</strong> ou em <strong>quantidade de uso</strong>.</p><div class="note red">Sem ativo identificado ou sem benefícios econômicos substancialmente todos, não há arrendamento.</div>`},
{label:'Arrendatária · reconhecimento',body:`<h2>Quem usa o bem registra o quê?</h2><p><strong>Arrendatária</strong> é quem recebe o direito de uso.</p><div class="grid"><div class="tile"><strong>ATIVO</strong>Direito de usar o bem.</div><div class="tile"><strong>PASSIVO</strong>Obrigação de fazer os pagamentos.</div></div><div class="note">São dois elementos distintos, reconhecidos em regra na data de início.</div>`},
{label:'Arrendatária · valor inicial',body:`<h2>Como medir no início?</h2><div class="grid"><div class="tile"><strong>Direito de uso</strong>Mensurado ao <b>custo</b>.</div><div class="tile"><strong>Passivo</strong>Valor <b>presente</b> dos pagamentos ainda não efetuados.</div></div><div class="note warn">O custo do direito de uso pode incluir outros componentes, como custos diretos iniciais, pagamentos antecipados e estimativas de restauração, com dedução dos incentivos recebidos.</div>`},
{label:'Arrendatária · depois do início',body:`<h2>Ativo e passivo seguem caminhos diferentes</h2><div class="grid"><div class="tile"><strong>ATIVO</strong>Sofre, em regra, <b>depreciação</b>.</div><div class="tile"><strong>PASSIVO</strong><b>Juros aumentam.</b><br><b>Pagamentos diminuem.</b></div></div><div class="formula">Passivo final = inicial<br>+ juros − pagamentos</div><div class="note red">A depreciação não reduz o passivo.</div>`},
{label:'Arrendatária · depreciação',body:`<h2>Até quando depreciar?</h2><p>Se a propriedade passar para a arrendatária, ou a compra for <strong>razoavelmente certa</strong>: use a <span class="green">vida útil do bem</span>.</p><p>Nos demais casos: termine na <span class="accent">data mais próxima</span> entre o fim da vida útil e o fim do prazo do arrendamento.</p>`},
{label:'Arrendadora · classificação',body:`<h2>Financeiro ou operacional?</h2><p><strong>Arrendadora</strong> é quem concede o direito de uso.</p><div class="grid"><div class="tile"><strong>FINANCEIRO</strong>Transfere substancialmente os riscos e benefícios da propriedade.</div><div class="tile"><strong>OPERACIONAL</strong>Não transfere substancialmente esses riscos e benefícios.</div></div><div class="note warn">A propriedade jurídica não precisa ser transferida para haver arrendamento financeiro.</div>`},
{label:'Arrendadora · indícios',body:`<h2>Indícios de arrendamento financeiro</h2><ul><li>Prazo cobre <strong>a maior parte da vida econômica</strong>.</li><li>Valor presente dos recebimentos corresponde substancialmente ao <strong>valor justo</strong> do ativo.</li><li>Ativo é <strong>especializado</strong> para a arrendatária.</li><li>Há transferência de propriedade ou compra razoavelmente certa.</li></ul><div class="note">Os indícios podem ocorrer isoladamente ou em conjunto. Avalie a substância do contrato.</div>`}
];
let index=0;const el=id=>document.getElementById(id);function render(){const s=slides[index];el('slide').innerHTML=`<div class="eyebrow">${s.label}</div><article class="card">${s.body}</article>`;el('count').textContent=`${index+1} / ${slides.length}`;el('fill').style.width=`${(index+1)/slides.length*100}%`;el('prev').disabled=index===0;el('next').disabled=index===slides.length-1;scrollTo({top:0,behavior:'instant'})}function move(n){index=Math.max(0,Math.min(slides.length-1,index+n));render()}el('prev').onclick=()=>move(-1);el('next').onclick=()=>move(1);el('restart').onclick=()=>{index=0;render()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});let sx=null;document.addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX},{passive:true});document.addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>80)move(dx<0?1:-1);sx=null},{passive:true});render();
</script></body></html>
