<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123f73"><title>Arrendamentos — Aula do zero | Professor Moreira</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9f5ff;color:#173a5c;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}.app{max-width:800px;min-height:100svh;margin:auto;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);display:flex;flex-direction:column}header{text-align:center;color:#123f73;font-weight:900;font-size:clamp(15px,4vw,19px);padding:12px 4px 10px}.bar{height:6px;border-radius:8px;background:#c1dbef;overflow:hidden}.bar i{display:block;height:100%;background:#0c80c9;transition:width .2s}main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:16px 2px 20px;gap:10px}.stage{color:#2874a7;font-weight:900;text-transform:uppercase;font-size:clamp(15px,4vw,19px);letter-spacing:.04em}.card{border-radius:23px;background:white;padding:clamp(20px,5vw,34px);border:2px solid #c7e5f6;box-shadow:0 9px 24px #2348691f}.card h1,.card h2{color:#123f73;line-height:1.12;margin:0 0 17px;font-size:clamp(28px,7vw,43px)}.card p,.card li{font-size:clamp(21px,5.3vw,28px);line-height:1.38;margin:0 0 15px}.card p:last-child,.card li:last-child{margin-bottom:0}.card ul{margin:0;padding-left:1.25em}.scene{background:#e9f4ff;border-left:7px solid #1887cf;border-radius:12px;padding:15px 17px;margin:12px 0;font-size:clamp(20px,5vw,26px);line-height:1.38}.answer{background:#e8f7ee;border-left:7px solid #159264;border-radius:12px;padding:15px 17px;margin:12px 0;font-size:clamp(20px,5vw,26px);line-height:1.38}.caution{background:#fff2da;border-left:7px solid #e4a72c;border-radius:12px;padding:15px 17px;margin:12px 0;font-size:clamp(20px,5vw,26px);line-height:1.38}.big{font-weight:900;color:#123f73}.red{font-weight:850;color:#b32535}.green{font-weight:850;color:#087851}.equation{background:#e7f5ff;border-radius:15px;text-align:center;padding:17px;font-size:clamp(22px,5.5vw,30px);line-height:1.35;color:#123f73;font-weight:900}.reveal{display:block;background:#145d99;border:0;color:white;font-size:clamp(19px,4.8vw,24px);font-weight:850;border-radius:12px;padding:12px 18px;margin:15px 0;cursor:pointer}.hidden{display:none}.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}.duo>div{background:#e9f4ff;border-radius:14px;padding:12px;font-size:clamp(18px,4.6vw,24px);line-height:1.3}.duo>div+div{background:#e8f7ee}.duo b{display:block;color:#124b80;margin-bottom:5px}footer{position:sticky;bottom:0;background:#e9f5fff5;border-top:1px solid #bedbed;padding:9px 0 max(8px,env(safe-area-inset-bottom));backdrop-filter:blur(7px)}.nav{display:flex;gap:8px;align-items:center}.nav button{height:54px;min-width:56px;border:0;border-radius:13px;background:#123f73;color:white;font-size:27px;font-weight:850;cursor:pointer}.nav button:disabled{opacity:.34}.nav .reset{background:#d5eaf8;color:#123f73;padding:0 12px;font-size:16px}.count{flex:1;text-align:center;font-size:17px;font-weight:850}.signature{text-align:center;font-size:13px;margin-top:7px;color:#386282;font-weight:700}@media(max-width:380px){.duo{grid-template-columns:1fr}.card{padding:18px}}@media(max-height:700px){main{justify-content:flex-start}.card p,.card li{font-size:clamp(19px,4.8vw,25px)}}
</style></head><body><div class="app"><header>CURSO DE CONTABILIDADE<br>PROFESSOR MOREIRA</header><div class="bar"><i id="progress"></i></div><main id="main" aria-live="polite"></main><footer><div class="nav"><button id="back" aria-label="Voltar">←</button><span class="count" id="count"></span><button id="forward" aria-label="Avançar">→</button><button class="reset" id="reset">Reiniciar</button></div><div class="signature">Quem quer ser aprovado <strong>estuda</strong>.</div></footer></div><script>
const pages=[
['CAPA',`<h1>A história da máquina de R$ 150 mil</h1><p>A ABC precisa de uma máquina. A XYZ tem uma disponível. Elas fazem um contrato de quatro anos.</p><div class="scene">Acompanhe o contrato do primeiro registro até a devolução.</div>`],
['OS PERSONAGENS',`<h2>Quem é quem?</h2><div class="duo"><div><b>ABC</b>Vai usar a máquina. É a <strong>arrendatária</strong>.</div><div><b>XYZ</b>Concede o uso. É a <strong>arrendadora</strong>.</div></div><p>A máquina é o <strong>ativo subjacente</strong>.</p>`],
['ANTES DA CONTABILIDADE',`<h2>Há arrendamento?</h2><p>A ABC recebe o direito de usar uma máquina <strong>identificada</strong>, controla seu uso por quatro anos e paga por isso.</p><div class="answer">Há um arrendamento: a ABC controla o uso de um ativo identificado por um período, em troca de contraprestação.</div>`],
['O CONTRATO',`<h2>As condições combinadas</h2><p>Valor do direito de uso: <strong>R$ 150.000</strong>.</p><p>Entrada hoje: <strong>R$ 60.000</strong>.</p><p>Depois: <strong>4 parcelas anuais de R$ 28.000</strong>.</p><p>Taxa anual aproximada: <strong>9,36%</strong>.</p>`],
['A PRIMEIRA DÚVIDA',`<h2>Quanto a ABC deve hoje?</h2><p>As quatro parcelas somam <strong>R$ 112.000</strong>. Será esse o passivo inicial?</p><button class="reveal" onclick="reveal(this)">Toque para descobrir</button><div class="answer hidden"><strong>Não.</strong> A obrigação inicial é registrada pelo <strong>valor presente</strong> dos pagamentos ainda não efetuados: aproximadamente <strong>R$ 90.000</strong>.</div>`],
['POR QUE 90 MIL?',`<h2>Dinheiro hoje ≠ dinheiro no futuro</h2><p>Os R$ 112.000 serão pagos durante quatro anos. O valor presente dessas parcelas, na data inicial, é de aproximadamente <strong>R$ 90.000</strong>.</p><div class="caution">Os juros dos anos seguintes serão reconhecidos <strong>ao longo do contrato</strong>, não todos no início.</div>`],
['DOIS REGISTROS',`<h2>O que nasce na ABC?</h2><div class="duo"><div><b>ATIVO</b>Direito de usar a máquina: <strong>R$ 150.000</strong>.</div><div><b>PASSIVO</b>Pagamentos futuros a valor presente: <strong>R$ 90.000</strong>.</div></div><div class="scene">A entrada de R$ 60.000 completa o custo inicial do direito de uso neste exemplo.</div>`],
['LANÇAMENTO INICIAL',`<h2>Vamos registrar?</h2><p><strong>Débito:</strong> ativo de direito de uso <strong>R$ 150.000</strong>.</p><p><strong>Crédito:</strong> caixa <strong>R$ 60.000</strong>.</p><p><strong>Crédito:</strong> passivo de arrendamento <strong>R$ 90.000</strong>.</p><div class="equation">Débitos 150.000<br>= créditos 60.000 + 90.000</div>`],
['REGRA DO PASSIVO',`<h2>A receita para cada ano</h2><p>Comece pelo saldo do passivo. Calcule os juros. Depois desconte a parcela paga.</p><div class="equation">Saldo final = saldo inicial<br>+ juros − pagamento</div><div class="answer">Juros <strong>aumentam</strong> a dívida. Pagamentos <strong>diminuem</strong> a dívida.</div>`],
['ANO 1: JUROS',`<h2>Passou o primeiro ano</h2><p>A ABC ainda deve <strong>R$ 90.000</strong>. O juro aproximado é:</p><div class="equation">90.000 × 9,36%<br>= R$ 8.424</div><p><strong>Débito:</strong> despesa financeira.<br><strong>Crédito:</strong> passivo de arrendamento.</p>`],
['ANO 1: PARCELA',`<h2>Agora a ABC paga R$ 28 mil</h2><p>Primeiro, o passivo aumentou pelos juros: <strong>90.000 + 8.424 = 98.424</strong>.</p><p>Depois, caiu com a parcela:</p><div class="equation">98.424 − 28.000<br>= R$ 70.424</div><p><strong>Débito:</strong> passivo.<br><strong>Crédito:</strong> caixa.</p>`],
['O OUTRO CAMINHO',`<h2>E o ativo de direito de uso?</h2><p>A máquina será devolvida após quatro anos. Admitimos vida útil maior que o contrato e depreciação linear.</p><div class="equation">150.000 ÷ 4 anos<br>= R$ 37.500 por ano</div><div class="caution">A depreciação do ativo <strong>não reduz o passivo</strong>.</div>`],
['LANÇAMENTO DA DEPRECIAÇÃO',`<h2>O registro anual</h2><p><strong>Débito:</strong> despesa de depreciação <strong>R$ 37.500</strong>.</p><p><strong>Crédito:</strong> depreciação acumulada do direito de uso <strong>R$ 37.500</strong>.</p><div class="scene">A despesa vai ao resultado. A depreciação acumulada reduz o valor contábil do ativo.</div>`],
['RECAPITULE O ANO 1',`<h2>Três fatos diferentes</h2><p><strong>Juros:</strong> aumentaram o passivo em R$ 8.424.</p><p><strong>Parcela:</strong> reduziu o passivo em R$ 28.000.</p><p><strong>Depreciação:</strong> reduziu o valor contábil do ativo em R$ 37.500.</p><div class="answer">Passivo após o pagamento: <strong>R$ 70.424</strong>.</div>`],
['ANO 2: SUA VEZ',`<h2>Quanto serão os juros?</h2><p>Saldo no início do ano 2: <strong>R$ 70.424</strong>. Taxa aproximada: <strong>9,36%</strong>.</p><button class="reveal" onclick="reveal(this)">Revelar o cálculo</button><div class="answer hidden">70.424 × 9,36% = <strong>R$ 6.591,69</strong>. Os juros caíram porque a dívida ficou menor.</div>`],
['ANO 2: NOVO SALDO',`<h2>Mais uma parcela paga</h2><div class="equation">70.424 + 6.591,69<br>− 28.000<br>= R$ 49.015,69</div><p>A ABC também registra mais <strong>R$ 37.500</strong> de depreciação no ano 2.</p>`],
['ANO 3',`<h2>O processo se repete</h2><p>Saldo inicial: <strong>R$ 49.015,69</strong>.</p><p>Juros aproximados: <strong>R$ 4.587,87</strong>.</p><div class="equation">49.015,69 + 4.587,87<br>− 28.000<br>= R$ 25.603,56</div><p>Depreciação do ano: <strong>R$ 37.500</strong>.</p>`],
['ANO 4',`<h2>A última parcela</h2><p>Saldo inicial: <strong>R$ 25.603,56</strong>.</p><p>Juros pela taxa arredondada: <strong>R$ 2.396,49</strong>.</p><div class="equation">25.603,56 + 2.396,49<br>− 28.000 = R$ 0,05</div><div class="caution">Os <strong>R$ 0,05</strong> decorrem do arredondamento da taxa. Na conciliação final, o passivo é zerado.</div>`],
['O QUADRO COMPLETO',`<h2>A dívida ano a ano</h2><div class="scene"><strong>Início:</strong> R$ 90.000<br><strong>Após ano 1:</strong> R$ 70.424<br><strong>Após ano 2:</strong> R$ 49.015,69<br><strong>Após ano 3:</strong> R$ 25.603,56<br><strong>Após ano 4:</strong> zero, após ajuste de arredondamento.</div><p>Os juros diminuem porque o saldo sobre o qual incidem diminui.</p>`],
['O FIM DO DIREITO',`<h2>A ABC devolve a máquina</h2><p>Foram quatro anos de depreciação:</p><div class="equation">4 × 37.500 = R$ 150.000</div><p>O direito de uso está totalmente depreciado. A ABC devolve a máquina e baixa o ativo e sua depreciação acumulada.</p>`],
['BAIXA DO ATIVO',`<h2>Como baixar?</h2><p><strong>Débito:</strong> depreciação acumulada do direito de uso <strong>R$ 150.000</strong>.</p><p><strong>Crédito:</strong> ativo de direito de uso <strong>R$ 150.000</strong>.</p><div class="answer">Encerrado o contrato: direito de uso e passivo de arrendamento estão zerados.</div>`],
['SE HOUVESSE COMPRA',`<h2>E se a ABC ficasse com a máquina?</h2><p>Se a propriedade fosse transferida ou a compra fosse <strong>razoavelmente certa</strong>, a depreciação acompanharia a <strong>vida útil do equipamento</strong>.</p><div class="scene">Se a vida útil fosse de 10 anos, com custo de R$ 150.000 e depreciação linear: <strong>R$ 15.000 por ano</strong>.</div><div class="caution">Não se escolhe simplesmente o menor valor anual entre dois cálculos.</div>`],
['GASTOS ADICIONAIS',`<h2>E transporte e instalação?</h2><p>Custos diretamente atribuíveis ao arrendamento e obrigações estimadas de desmontagem ou restauração podem compor o <strong>custo do direito de uso</strong>, conforme o contrato.</p><div class="caution">Os valores deste exemplo foram simplificados: consideramos apenas a entrada e o passivo inicial.</div>`],
['EXCEÇÕES',`<h2>Todo contrato segue esses registros?</h2><p>A arrendatária pode optar pela dispensa de reconhecimento em certos arrendamentos de <strong>curto prazo</strong> ou de <strong>ativo subjacente de baixo valor</strong>.</p><div class="scene">Curto prazo: até <strong>12 meses</strong> na data de início e <strong>sem opção de compra</strong>.</div>`],
['BAIXO VALOR',`<h2>O que é ativo de baixo valor?</h2><p>A avaliação considera o valor do <strong>bem individual quando novo</strong>.</p><div class="caution">Não basta olhar o valor total do contrato nem comparar o preço com o porte da empresa.</div><p>Quando a dispensa aplicável é adotada, os pagamentos são reconhecidos como despesa ao longo do contrato.</p>`],
['A XYZ TAMBÉM REGISTRA',`<h2>O lado da arrendadora</h2><p>A XYZ verifica se o contrato transfere à ABC <strong>substancialmente os riscos e benefícios</strong> ligados à propriedade.</p><div class="duo"><div><b>SIM</b>Arrendamento <strong>financeiro</strong>.</div><div><b>NÃO</b>Arrendamento <strong>operacional</strong>.</div></div>`],
['INDÍCIOS',`<h2>Como perceber a transferência?</h2><p>Indícios de arrendamento financeiro:</p><ul><li>Prazo cobre a maior parte da <strong>vida econômica</strong>.</li><li>Valor presente dos recebimentos ≈ <strong>valor justo</strong> do ativo.</li><li>Ativo é muito <strong>especializado</strong>.</li></ul><div class="caution">A classificação exige analisar a substância do contrato.</div>`],
['RESUMO DA HISTÓRIA',`<h2>O que ficou na cabeça?</h2><div class="answer"><strong>ABC, que usa:</strong> direito de uso no ativo; obrigação de pagar no passivo.</div><div class="scene"><strong>A cada ano:</strong> juros aumentam o passivo; parcela diminui; depreciação reduz o ativo.</div><div class="answer"><strong>XYZ, que concede:</strong> classifica o contrato como financeiro ou operacional.</div>`]
];
let at=0;const $=x=>document.getElementById(x);function render(){let [label,body]=pages[at];$('main').innerHTML=`<div class="stage">${label}</div><article class="card">${body}</article>`;$('count').textContent=`${at+1} / ${pages.length}`;$('progress').style.width=`${(at+1)*100/pages.length}%`;$('back').disabled=at===0;$('forward').disabled=at===pages.length-1;window.scrollTo(0,0)}function move(n){at=Math.min(pages.length-1,Math.max(0,at+n));render()}function reveal(button){button.nextElementSibling.classList.remove('hidden');button.remove()}$('back').onclick=()=>move(-1);$('forward').onclick=()=>move(1);$('reset').onclick=()=>{at=0;render()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});let start=null;document.addEventListener('touchstart',e=>start=e.changedTouches[0].clientX,{passive:true});document.addEventListener('touchend',e=>{if(start===null)return;let delta=e.changedTouches[0].clientX-start;if(Math.abs(delta)>90)move(delta<0?1:-1);start=null},{passive:true});render();
</script></body></html>
