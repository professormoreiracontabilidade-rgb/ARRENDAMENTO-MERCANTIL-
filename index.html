<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123f73"><title>Arrendamentos — Aula do zero | Professor Moreira</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9f5ff;color:#173a5c;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}.app{max-width:800px;min-height:100svh;margin:auto;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);display:flex;flex-direction:column}header{text-align:center;color:#123f73;font-weight:900;font-size:clamp(15px,4vw,19px);padding:12px 4px 10px}.bar{height:6px;border-radius:8px;background:#c1dbef;overflow:hidden}.bar i{display:block;height:100%;background:#0c80c9;transition:width .2s}main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:16px 2px 20px;gap:10px}.stage{color:#2874a7;font-weight:900;text-transform:uppercase;font-size:clamp(15px,4vw,19px);letter-spacing:.04em}.card{border-radius:23px;background:white;padding:clamp(20px,5vw,34px);border:2px solid #c7e5f6;box-shadow:0 9px 24px #2348691f}.card h1,.card h2{color:#123f73;line-height:1.12;margin:0 0 17px;font-size:clamp(28px,7vw,43px)}.card p,.card li{font-size:clamp(21px,5.3vw,28px);line-height:1.38;margin:0 0 15px}.card p:last-child,.card li:last-child{margin-bottom:0}.card ul{margin:0;padding-left:1.25em}.scene{background:#e9f4ff;border-left:7px solid #1887cf;border-radius:12px;padding:15px 17px;margin:12px 0;font-size:clamp(20px,5vw,26px);line-height:1.38}.answer{background:#e8f7ee;border-left:7px solid #159264;border-radius:12px;padding:15px 17px;margin:12px 0;font-size:clamp(20px,5vw,26px);line-height:1.38}.caution{background:#fff2da;border-left:7px solid #e4a72c;border-radius:12px;padding:15px 17px;margin:12px 0;font-size:clamp(20px,5vw,26px);line-height:1.38}.big{font-weight:900;color:#123f73}.red{font-weight:850;color:#b32535}.green{font-weight:850;color:#087851}.equation{background:#e7f5ff;border-radius:15px;text-align:center;padding:17px;font-size:clamp(22px,5.5vw,30px);line-height:1.35;color:#123f73;font-weight:900}.reveal{display:block;background:#145d99;border:0;color:white;font-size:clamp(19px,4.8vw,24px);font-weight:850;border-radius:12px;padding:12px 18px;margin:15px 0;cursor:pointer}.hidden{display:none}.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}.duo>div{background:#e9f4ff;border-radius:14px;padding:12px;font-size:clamp(18px,4.6vw,24px);line-height:1.3}.duo>div+div{background:#e8f7ee}.duo b{display:block;color:#124b80;margin-bottom:5px}footer{position:sticky;bottom:0;background:#e9f5fff5;border-top:1px solid #bedbed;padding:9px 0 max(8px,env(safe-area-inset-bottom));backdrop-filter:blur(7px)}.nav{display:flex;gap:8px;align-items:center}.nav button{height:54px;min-width:56px;border:0;border-radius:13px;background:#123f73;color:white;font-size:27px;font-weight:850;cursor:pointer}.nav button:disabled{opacity:.34}.nav .reset{background:#d5eaf8;color:#123f73;padding:0 12px;font-size:16px}.count{flex:1;text-align:center;font-size:17px;font-weight:850}.signature{text-align:center;font-size:13px;margin-top:7px;color:#386282;font-weight:700}@media(max-width:380px){.duo{grid-template-columns:1fr}.card{padding:18px}}@media(max-height:700px){main{justify-content:flex-start}.card p,.card li{font-size:clamp(19px,4.8vw,25px)}}
</style></head><body><div class="app"><header>CURSO DE CONTABILIDADE<br>PROFESSOR MOREIRA</header><div class="bar"><i id="progress"></i></div><main id="main" aria-live="polite"></main><footer><div class="nav"><button id="back" aria-label="Voltar">←</button><span class="count" id="count"></span><button id="forward" aria-label="Avançar">→</button><button class="reset" id="reset">Reiniciar</button></div><div class="signature">Quem quer ser aprovado <strong>estuda</strong>.</div></footer></div><script>
const pages=[
['COMECE POR AQUI',`<h1>Arrendamento, do zero</h1><p>Imagine uma empresa que precisa de uma <strong>máquina</strong>, mas prefere usá-la por alguns anos em vez de comprá-la.</p><div class="scene">A empresa paga parcelas para usar a máquina de outra empresa.</div><p>Vamos acompanhar essa única história até a contabilização.</p>`],
['PERSONAGENS',`<h2>Quem é quem?</h2><div class="duo"><div><b>ARRENDATÁRIA</b>Quem recebe o direito de usar a máquina.</div><div><b>ARRENDADORA</b>Quem concede esse direito.</div></div><div class="scene">Na nossa história, <strong>ABC usa</strong> a máquina e <strong>XYZ a disponibiliza</strong>.</div><p><strong>ABC = arrendatária.</strong><br><strong>XYZ = arrendadora.</strong></p>`],
['IDEIA CENTRAL',`<h2>O que a ABC recebeu?</h2><p>A ABC não precisa ser dona da máquina para obter algo importante:</p><div class="answer"><strong>O direito de usar a máquina durante o contrato.</strong></div><p>É esse direito que a contabilidade precisa analisar.</p>`],
['PRIMEIRA PERGUNTA',`<h2>Qual máquina?</h2><p>O contrato indica a <strong>máquina M</strong> que ficará com a ABC por três anos.</p><div class="scene">Conseguimos apontar o bem: <strong>máquina M</strong>.</div><p>Ela pode ser um <strong>ativo identificado</strong>.</p><div class="caution">Se a XYZ puder substituí-la livremente e tiver um direito <strong>substantivo</strong> de fazer isso, a conclusão pode mudar.</div>`],
['PARE E PENSE',`<h2>Se não houver ativo identificado...</h2><p>O contrato contém arrendamento?</p><button class="reveal" onclick="reveal(this)">Toque para conferir</button><div class="answer hidden"><strong>Não.</strong> Sem ativo identificado, já falta uma condição essencial.</div>`],
['SEGUNDA PERGUNTA',`<h2>Quem aproveita o uso?</h2><p>Durante os três anos, a ABC usa a máquina em sua produção e obtém <strong>substancialmente todos os benefícios econômicos</strong> desse uso.</p><div class="answer">Pense no que a máquina produz para a ABC enquanto ela a utiliza.</div>`],
['TERCEIRA PERGUNTA',`<h2>Quem decide o uso?</h2><p>A ABC escolhe <strong>como</strong> e <strong>para qual finalidade</strong> usar a máquina durante o contrato.</p><div class="scene">Por exemplo: decide quais produtos fabricar e quando utilizar a máquina.</div><p>Assim, a ABC <strong>direciona o uso</strong>.</p>`],
['CASO ESPECIAL',`<h2>E se o uso já estiver predeterminado?</h2><p>Ainda pode haver controle pela ABC se ela puder <strong>operar</strong> o ativo durante todo o período sem alteração das instruções pela XYZ <strong>ou</strong> se tiver <strong>projetado</strong> o ativo de modo a predeterminar o uso.</p><div class="caution">Ter projetado a máquina <strong>não é requisito geral</strong> de todo arrendamento.</div>`],
['JUNTE AS PEÇAS',`<h2>Quando há arrendamento?</h2><div class="equation">Ativo identificado<br>+ controle do uso<br>+ período<br>+ contraprestação</div><div class="answer">Controle do uso envolve <strong>benefícios econômicos substancialmente todos</strong> e o <strong>direito de direcionar o uso</strong>.</div>`],
['TEMPO DE USO',`<h2>O período precisa ser em anos?</h2><p><strong>Não.</strong> Pode ser indicado em meses, anos ou até por uma <strong>quantidade de uso</strong> da máquina.</p><div class="scene">A identificação é reavaliada quando mudam os <strong>termos e condições</strong> do contrato. Não há revisão anual obrigatória só porque passou um ano.</div>`],
['CONTABILIDADE DA ABC',`<h2>A ABC registra a máquina como sua?</h2><p>Ela registra o <strong>direito de usar</strong> a máquina e a <strong>obrigação de pagar</strong> pelo contrato.</p><div class="duo"><div><b>ATIVO</b>Direito de uso.</div><div><b>PASSIVO</b>Arrendamento a pagar.</div></div><div class="caution">Direito de uso não significa, por si só, propriedade da máquina.</div>`],
['VALORES INICIAIS',`<h2>Por qual valor?</h2><div class="duo"><div><b>ATIVO DE DIREITO DE USO</b>Inicialmente, pelo <strong>custo</strong>.</div><div><b>PASSIVO</b>Pelo <strong>valor presente</strong> dos pagamentos ainda não efetuados.</div></div><div class="caution">O custo do ativo pode incluir outros componentes do contrato. Não é automaticamente o valor justo da máquina.</div>`],
['PAGAMENTOS',`<h2>O que acontece a cada período?</h2><p>Os <strong>juros aumentam</strong> o passivo. O <strong>pagamento diminui</strong> o passivo.</p><div class="equation">Passivo final = inicial<br>+ juros − pagamento</div><p>É parecido com acompanhar o saldo de uma dívida.</p>`],
['EXEMPLO NUMÉRICO',`<h2>Vamos calcular?</h2><p>Passivo inicial: <strong>R$ 100.000</strong><br>Juros: <strong>R$ 2.000</strong><br>Pagamento: <strong>R$ 10.000</strong></p><button class="reveal" onclick="reveal(this)">Ver o saldo final</button><div class="answer hidden">100.000 + 2.000 − 10.000 = <strong>R$ 92.000</strong>.</div>`],
['DEPRECIAÇÃO',`<h2>E o ativo de direito de uso?</h2><p>À medida que a ABC consome esse direito, ela reconhece, em regra, <strong>depreciação</strong>.</p><div class="caution">A despesa de depreciação <strong>não reduz o passivo</strong>. O passivo acompanha juros e pagamentos.</div>`],
['PRAZO DA DEPRECIAÇÃO',`<h2>Até quando depreciar?</h2><p>Se a propriedade passar para a ABC ou a compra for <strong>razoavelmente certa</strong>: até o fim da <strong>vida útil</strong> do bem.</p><p>Nos outros casos: até a data mais próxima entre o fim da <strong>vida útil</strong> e o fim do <strong>prazo do arrendamento</strong>.</p>`],
['AGORA, A XYZ',`<h2>Como a arrendadora classifica?</h2><p>A XYZ pergunta se transferiu à ABC <strong>substancialmente os riscos e benefícios</strong> ligados à propriedade.</p><div class="duo"><div><b>SIM</b>Arrendamento <strong>financeiro</strong>.</div><div><b>NÃO</b>Arrendamento <strong>operacional</strong>.</div></div>`],
['INDÍCIO: PRAZO',`<h2>Quase toda a vida econômica?</h2><p>Uma máquina tem vida econômica de <strong>25 anos</strong> e é arrendada por <strong>23 anos</strong>.</p><div class="equation">23 ÷ 25 = 92%</div><div class="answer">O prazo cobre <strong>a maior parte da vida econômica</strong>: forte indício de arrendamento financeiro.</div><div class="caution">92% é o resultado deste exemplo, não um limite fixo da norma.</div>`],
['OUTROS INDÍCIOS',`<h2>O que mais indica financeiro?</h2><ul><li>Valor presente dos recebimentos corresponde substancialmente ao <strong>valor justo</strong> do ativo.</li><li>O ativo é tão <strong>especializado</strong> que só a ABC pode usá-lo sem modificações importantes.</li><li>Há transferência da propriedade ou compra razoavelmente certa.</li></ul>`],
['REVISÃO FINAL',`<h2>Guarde estas 3 perguntas</h2><p><strong>1.</strong> A ABC controla o uso de um ativo identificado?</p><p><strong>2.</strong> Na ABC: qual é o direito no ativo e a obrigação no passivo?</p><p><strong>3.</strong> Na XYZ: os riscos e benefícios foram substancialmente transferidos?</p><div class="answer"><strong>Quem usa:</strong> direito de uso + passivo.<br><strong>Quem concede:</strong> financeiro ou operacional.</div>`]
];
let at=0;const $=x=>document.getElementById(x);function render(){let [label,body]=pages[at];$('main').innerHTML=`<div class="stage">${label}</div><article class="card">${body}</article>`;$('count').textContent=`${at+1} / ${pages.length}`;$('progress').style.width=`${(at+1)*100/pages.length}%`;$('back').disabled=at===0;$('forward').disabled=at===pages.length-1;window.scrollTo(0,0)}function move(n){at=Math.min(pages.length-1,Math.max(0,at+n));render()}function reveal(button){button.nextElementSibling.classList.remove('hidden');button.remove()}$('back').onclick=()=>move(-1);$('forward').onclick=()=>move(1);$('reset').onclick=()=>{at=0;render()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});let start=null;document.addEventListener('touchstart',e=>start=e.changedTouches[0].clientX,{passive:true});document.addEventListener('touchend',e=>{if(start===null)return;let delta=e.changedTouches[0].clientX-start;if(Math.abs(delta)>90)move(delta<0?1:-1);start=null},{passive:true});render();
</script></body></html>
